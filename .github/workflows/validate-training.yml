name: Validate Training

# Runs when a learner pushes their named branch.
on:
  push:
    branches:
      - '**'   # every branch; tighten to your learner-branch naming if you like

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 1. Run your validation and compute a score ──────────────────────────
      # Replace this with the real exercise checks. It must end by setting
      # a numeric SCORE (0-100) as a step output.
      - name: Grade exercise
        id: grade
        run: |
          # ... run tests / linters / whatever validates the exercise ...
          SCORE=87   # <-- compute this for real
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"

      # ── 2. Sign the score into a token the Scorpion item can verify ─────────
      - name: Sign score token
        id: sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}   # ES256 PKCS#8 PEM private key
        run: |
          # NOTE: github.event.pusher.email is the git-commit email and is
          # learner-controllable — fine for auditing, not for trust. Swap for a
          # SAML/org-identity lookup if you later want to enforce the email.
          TOKEN=$(node .github/scripts/sign-score.mjs \
            "${{ steps.grade.outputs.score }}" \
            "${{ github.actor }}" \
            "${{ github.repository }}" \
            "${{ github.event.pusher.email }}")
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # ── 3. Post the token back to the learner as a commit comment ───────────
      - name: Comment token on commit
        uses: actions/github-script@v7
        with:
          script: |
            const token = `${{ steps.sign.outputs.token }}`;
            const score = `${{ steps.grade.outputs.score }}`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: [
                `### Training validation`,
                ``,
                `**Score: ${score}**`,
                ``,
                `Copy the token below and paste it into the exam item to record your score:`,
                ``,
                '```',
                token,
                '```',
              ].join('\n'),
            });
