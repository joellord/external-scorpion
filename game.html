<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MongoDB Quest – Skill Check</title>
  <style>
    :root {
      --green: #00ed64;
      --dark:  #001e2b;
      --card:  #0f2b3d;
      --text:  #e8f1f2;
      --muted: #7a9eb1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .screen { display: none; flex-direction: column; align-items: center; gap: 1.5rem; width: 100%; max-width: 720px; }
    .screen.active { display: flex; }

    /* ── start ── */
    .logo { font-size: 3rem; }
    h1 { font-size: 2rem; color: var(--green); text-align: center; }
    .subtitle { color: var(--muted); text-align: center; }
    .form-row { display: flex; gap: 1rem; width: 100%; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
    .form-group label { font-size: 0.85rem; color: var(--muted); }
    .form-group input {
      padding: 0.65rem 1rem;
      border-radius: 6px;
      border: 1px solid #1e4a5c;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    .btn {
      padding: 0.75rem 2rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { background: var(--green); color: var(--dark); }
    .btn-outline { background: transparent; color: var(--green); border: 2px solid var(--green); }
    .error-box {
      background: #2d0f0f; border: 1px solid #8b1a1a; border-radius: 8px;
      padding: 1rem 1.25rem; color: #ffb3b3; font-size: 0.9rem; width: 100%; white-space: pre-wrap;
    }

    /* ── exam screen ── */
    #screen-exam {
      max-width: 100%;
      width: 100%;
      height: 100vh;
      padding: 0;
      justify-content: flex-start;
      gap: 0;
    }
    .exam-header {
      width: 100%;
      background: var(--card);
      border-bottom: 1px solid #1e4a5c;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }
    .exam-header .logo-small { font-size: 1.4rem; }
    .exam-header h2 { font-size: 1rem; color: var(--green); }
    .exam-header p { font-size: 0.8rem; color: var(--muted); margin-left: auto; }
    #exam-iframe {
      width: 100%;
      flex: 1;
      border: none;
    }

    /* ── loading ── */
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #1e4a5c;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── result ── */
    .result-icon { font-size: 4rem; }
    .result-title { font-size: 2rem; font-weight: 700; }
    .result-title.pass { color: var(--green); }
    .result-title.fail { color: #f85149; }
    .score-box {
      background: var(--card);
      border: 1px solid #1e4a5c;
      border-radius: 12px;
      padding: 1.5rem 3rem;
      text-align: center;
    }
    .score-value { font-size: 3rem; font-weight: 700; color: var(--green); }
    .score-label { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
  </style>
</head>
<body>

<!-- ── START ── -->
<div id="screen-start" class="screen active">
  <div class="logo">🍃</div>
  <h1>MongoDB Quest</h1>
  <p class="subtitle">Complete the skill check to earn your badge.<br>Your responses are recorded in Scorpion.</p>

  <div class="form-row">
    <div class="form-group">
      <label>First name</label>
      <input id="firstName" type="text" placeholder="Ada" />
    </div>
    <div class="form-group">
      <label>Last name</label>
      <input id="lastName" type="text" placeholder="Lovelace" />
    </div>
  </div>
  <div class="form-group" style="width:100%">
    <label>Email</label>
    <input id="email" type="email" placeholder="ada@example.com" />
  </div>

  <div id="start-error" class="error-box" style="display:none"></div>
  <button class="btn btn-primary" id="start-btn" onclick="startGame()">Start Quest →</button>
</div>

<!-- ── LOADING ── -->
<div id="screen-loading" class="screen">
  <div class="spinner"></div>
  <p id="loading-msg" style="color:var(--muted)">Summoning your quest…</p>
</div>

<!-- ── EXAM (Scorpion in iframe) ── -->
<div id="screen-exam" class="screen">
  <div class="exam-header">
    <span class="logo-small">🍃</span>
    <h2>MongoDB Quest</h2>
    <p id="exam-status">Exam in progress…</p>
  </div>
  <iframe id="exam-iframe" title="Skill check"></iframe>
</div>

<!-- ── RESULT ── -->
<div id="screen-result" class="screen">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-title" id="result-title"></div>
  <div class="score-box">
    <div class="score-value" id="result-score">—</div>
    <div class="score-label" id="score-label">Score</div>
  </div>
  <p id="result-message" style="color:var(--muted);text-align:center"></p>
  <button class="btn btn-outline" onclick="location.reload()">Play Again</button>
</div>

<script>
  let pollTimer = null;

  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  async function startGame() {
    const firstName = document.getElementById('firstName').value.trim() || 'Player';
    const lastName  = document.getElementById('lastName').value.trim()  || 'One';
    const email     = document.getElementById('email').value.trim()     || 'player@example.com';

    document.getElementById('start-error').style.display = 'none';
    document.getElementById('start-btn').disabled = true;
    show('screen-loading');

    const resp = await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ firstName, lastName, email }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      show('screen-start');
      document.getElementById('start-btn').disabled = false;
      const box = document.getElementById('start-error');
      box.style.display = 'block';
      box.textContent = `Error ${resp.status}: ${err.error || 'Unknown error'}\n${err.hint || ''}`;
      return;
    }

    const { deliveryId, launchUrl } = await resp.json();

    // Load Scorpion in the iframe
    document.getElementById('exam-iframe').src = launchUrl;
    show('screen-exam');

    // Start polling for completion
    pollTimer = setInterval(() => checkResult(deliveryId), 3000);
  }

  async function checkResult(deliveryId) {
    const resp = await fetch(`/api/result/${deliveryId}`);
    const data = await resp.json();

    if (data.status === 'complete') {
      clearInterval(pollTimer);
      showResult(data);
    }
  }

  function showResult(data) {
    const passed = data.passed;
    document.getElementById('result-icon').textContent = passed ? '🏆' : '📚';
    const titleEl = document.getElementById('result-title');
    titleEl.textContent = passed ? 'Quest Complete!' : 'Keep Practicing';
    titleEl.className = 'result-title ' + (passed ? 'pass' : 'fail');

    const [lo, hi] = data.scoreScale || [0, 100];
    document.getElementById('result-score').textContent = data.score != null ? Math.round(data.score) : '—';
    document.getElementById('score-label').textContent = `Score (${lo}–${hi})`;
    document.getElementById('result-message').textContent = passed
      ? 'Your responses have been recorded in Scorpion. Badge incoming!'
      : 'Your responses have been recorded. Review the material and try again.';

    show('screen-result');
  }
</script>
</body>
</html>
